[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-bench"
# Distribution release, independent of the immutable benchmark suite below.
version = "1.1.1"
description = "Evidence-first executable benchmark for downstream failure investigation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "DATA_LICENSE.md", "LICENSES.md"]
authors = [{ name = "Smkz-Entertainment" }]
dependencies = []
keywords = [
  "benchmark",
  "causal-inference",
  "dependency-management",
  "regression-testing",
  "reproducible-research",
  "security",
  "software-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
[project.urls]
Homepage = "https://github.com/Smkzz/radar-bench"
Repository = "https://github.com/Smkzz/radar-bench"
Issues = "https://github.com/Smkzz/radar-bench/issues"
Changelog = "https://github.com/Smkzz/radar-bench/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Smkzz/radar-bench/tree/main/docs"
Security = "https://github.com/Smkzz/radar-bench/security/advisories/new"

[project.optional-dependencies]
# For reproducible development/CI use the transitive requirements-dev.lock.
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "build>=1.2"]

[project.scripts]
radar-bench = "radar_bench.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar_bench = [
  "py.typed",
  "resources/candidate/decisive-v1.2/*.json",
  "resources/corpus/v1.1.0/decisive-v1.2/*.json",
  "resources/corpus/v1.0.1/decisive-v1.1/reproducers/*.py",
  "resources/corpus/v1.0.1/safety-twins/runtime-manifest.json",
  "resources/corpus/v1.0.1/safety-twins/runtime/*.py",
  "resources/corpus/v1.0.1/safety-twins/runtime/*.json",
  "resources/corpus/v1.0.1/safety-twins/runtime/*/*.py",
  "resources/corpus/v1.0.1/safety-twins/runtime/*/*.dat",
  "resources/corpus/v1.0.1/safety-twins/runtime/*/*.lock",
  "resources/schema/*.json",
]

[tool.setuptools.data-files]
"share/radar-bench/schema" = ["schema/*.json"]

[tool.radar]
schema_version = "1.0"
# Suite identities are protocol/corpus versions, not Python package releases.
current_suite = "decisive-v1.2"
historical_reference_suite = "decisive-v1.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["radar_bench"]
branch = true
omit = ["src/radar_bench/resources/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
exclude = "src/radar_bench/resources"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]
